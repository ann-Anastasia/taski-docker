version: '3.8'

volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: annanastasia/taski_backend:latest
    env_file: .env
    volumes:
      - static_volume:/backend_static
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: annanastasia/taski_frontend:latest
    env_file: .env
    command: sh -c "cp -r /app/build/. /frontend_static/ && node -e 'setInterval(() => {}, 1000)'"
    volumes:
      - static_volume:/frontend_static

  gateway:
    image: annanastasia/taski_gateway:latest
    env_file: .env
    volumes:
      - static_volume:/staticfiles/
    ports:
      - 8000:80
    depends_on:
      - backend
      - frontend
